<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#111827">
    <meta name="description" content="Agent sessions, briefly connected.">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <link rel="stylesheet" href="/styles.css">
    <title>notify.guru</title>
  </head>
  <body>
    <header>
      <a class="brand" href="/">notify.guru</a>
      <span id="connection-state" aria-live="polite">準備中</span>
    </header>
    <main>
      <section id="intro">
        <p class="eyebrow">EPHEMERAL AGENT NOTIFICATIONS</p>
        <h1>作業の続きを、手元で待つ。</h1>
        <p>CLIに表示されたQRコードをデバイスのカメラで読み取ると、この画面にセッションが追加されます。</p>
      </section>
      <p id="message" role="status" aria-live="polite"></p>
      <section id="startup-error" class="group-card error-card" hidden>
        <p class="card-label">ERROR</p>
        <h2>起動できません</h2>
        <p id="startup-error-message" role="alert"></p>
        <div id="reset-local-data-actions" hidden>
          <p>保存データを削除すると、このブラウザを新しいデバイスとして設定し直せます。保存済みのセッションも削除されます。</p>
          <button id="reset-local-data" class="destructive" type="button">このデバイスのデータをリセット</button>
        </div>
      </section>
      <section id="device-summary" class="group-card" hidden>
        <div class="card-head">
          <div>
            <p class="card-label">DEVICE GROUP</p>
            <h2 id="device-summary-title">共有なし</h2>
          </div>
          <button id="open-device-management" type="button">デバイスグループの管理</button>
        </div>
      </section>
      <section id="device-management" class="group-card" hidden>
        <div class="card-head">
          <div>
            <p class="card-label">DEVICE GROUP</p>
            <h2>デバイスグループの管理</h2>
          </div>
          <button id="close-device-management" type="button">完了</button>
        </div>
        <p id="group-status"></p>
        <p id="group-key-time"></p>
        <button id="request-device-sharing" type="button">このデバイスを別のグループに追加する</button>
        <div id="group-devices"></div>
        <button id="leave-device-group" class="destructive" type="button" hidden>このデバイスをグループから除外する</button>
      </section>
      <section id="join-device" class="group-card" hidden>
        <p class="card-label">DEVICE GROUP</p>
        <h2>別のグループへの追加待ち</h2>
        <p id="join-device-status"></p>
        <div id="invitation-qr"></div>
        <button id="share-invitation" type="button">グループ追加用リンクを共有</button>
      </section>
      <section id="cards" aria-label="セッション"></section>
      <section id="empty" hidden>
        <div class="empty-mark" aria-hidden="true">⌁</div>
        <p>参加中のセッションはありません。</p>
      </section>
    </main>
    <template id="card-template">
      <article class="card">
        <div class="card-head">
          <div>
            <p class="card-label">SESSION</p>
            <h2 class="session-title"></h2>
          </div>
          <div class="card-meta">
            <span class="unresolved-count" hidden></span>
            <span class="session-time relative-time"></span>
            <span class="expiry"></span>
          </div>
        </div>
        <p class="status"></p>
        <section class="notifications" aria-label="通知"></section>
        <section class="request" hidden>
          <div class="request-head">
            <div class="request-content">
              <p class="request-prompt"></p>
              <span class="request-time relative-time"></span>
            </div>
            <button class="request-dismiss dismiss-item" type="button" aria-label="リクエストを閉じる" title="リクエストを閉じる">×</button>
          </div>
          <div class="request-options"></div>
        </section>
        <section class="feedback">
          <button class="feedback-toggle" type="button" aria-label="メッセージを送る" title="メッセージを送る">💬</button>
          <form class="feedback-form" hidden>
            <label>このセッションへメッセージを送る
              <textarea class="feedback-message" name="message" maxlength="20000" required></textarea>
            </label>
            <div class="feedback-actions">
              <button type="submit">送信</button>
              <button class="feedback-cancel" type="button">キャンセル</button>
            </div>
          </form>
        </section>
      </article>
    </template>
    <script type="module" src="/app.js"></script>
  </body>
</html>
