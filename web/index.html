<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#111827">
    <meta name="description" content="Agent sessions, briefly connected.">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <link rel="stylesheet" href="/styles.css">
    <title>notify.guru</title>
  </head>
  <body>
    <header>
      <a class="brand" href="/">notify.guru</a>
      <span id="connection-state" aria-live="polite">準備中</span>
    </header>
    <main>
      <section id="intro">
        <p class="eyebrow">EPHEMERAL AGENT NOTIFICATIONS</p>
        <h1>作業の続きを、手元で待つ。</h1>
        <p>CLIに表示されたQRコードを端末のカメラで読み取ると、この画面にセッションが追加されます。</p>
      </section>
      <p id="message" role="status" aria-live="polite"></p>
      <section id="device-group" class="group-card" hidden>
        <div class="card-head">
          <div>
            <p class="card-label">DEVICE GROUP</p>
            <h2>この端末のグループ</h2>
          </div>
          <span id="group-generation"></span>
        </div>
        <p id="group-status"></p>
        <button id="invite-device" type="button">端末を追加</button>
        <div id="invitation" hidden>
          <p>追加する端末で次のリンクを開いてください。有効期間は10分です。</p>
          <a id="invitation-link"></a>
        </div>
        <div id="pending-devices"></div>
        <div id="group-devices"></div>
      </section>
      <section id="join-device" class="group-card" hidden>
        <p class="card-label">DEVICE VERIFICATION</p>
        <h2>端末追加の確認</h2>
        <p id="join-device-status"></p>
        <p id="verification-code" class="verification-code"></p>
      </section>
      <section id="cards" aria-label="セッション"></section>
      <section id="empty" hidden>
        <div class="empty-mark" aria-hidden="true">⌁</div>
        <p>参加中のセッションはありません。</p>
      </section>
    </main>
    <template id="card-template">
      <article class="card">
        <div class="card-head">
          <div>
            <p class="card-label">SESSION</p>
            <h2 class="session-title"></h2>
          </div>
          <span class="expiry"></span>
        </div>
        <p class="status"></p>
        <p class="notification"></p>
        <section class="request" hidden>
          <p class="request-prompt"></p>
          <div class="request-options"></div>
        </section>
      </article>
    </template>
    <script type="module" src="/app.js"></script>
  </body>
</html>
